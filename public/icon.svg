<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#0B1F33" />

  <!-- Outer fine concentric rings -->
  <circle cx="256" cy="256" r="204" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.72" />
  <circle cx="256" cy="256" r="184" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.85" />

  <!-- Main thick white ring -->
  <circle cx="256" cy="256" r="136" fill="none" stroke="#FFFFFF" stroke-width="32" />

  <!-- Three tilted diagonal strokes inside the ring -->
  <g transform="rotate(-30 256 256)" fill="#FFFFFF">
    <rect x="192" y="216" width="24" height="80" rx="12" />
    <rect x="244" y="182" width="24" height="148" rx="12" />
    <rect x="296" y="216" width="24" height="80" rx="12" />
  </g>
</svg>
